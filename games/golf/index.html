<style>
/* Golf only: club and aim buttons (bottom left, clear of the tap area), and a wrapping mode row. */
#gctl{position:absolute;left:14px;bottom:16px;z-index:8;display:flex;flex-direction:column;gap:6px;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
#gctl.show{opacity:1;visibility:visible;transition:opacity .2s}
#gctl .grow{display:flex;align-items:center;gap:4px;padding:3px;border-radius:25px;background:rgba(10,26,20,.86);border:1px solid rgba(241,236,224,.22);backdrop-filter:blur(6px)}
#gctl button{width:42px;height:42px;padding:0;border-radius:50%;border:0;background:rgba(241,236,224,.1);color:var(--chalk);display:grid;place-items:center;cursor:pointer;touch-action:none}
#gctl button:active{background:rgba(241,236,224,.3)}
#gctl button:disabled{opacity:.3;cursor:default}
#gctl svg{width:20px;height:20px}
#gctl .gval{width:84px;text-align:center;display:flex;flex-direction:column;gap:3px}
#gctl .gval b{font:800 17px/1 var(--display);color:var(--chalk);white-space:nowrap}
#gctl .gval span{font:600 11px/1 var(--ui);color:var(--chalk-dim);white-space:nowrap}
#optMode{flex-wrap:wrap}
@media (max-width:640px){ #optMode button{padding:9px 9px} }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/games/golf/main.js"></script>
</body>

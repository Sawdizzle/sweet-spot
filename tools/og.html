<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<!-- Renders a 1200x630 link-preview card. tools/make-og.sh screenshots it
     once per game: /tools/og.html?game=fieldgoal (or ?game=home). -->
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1611;--chalk:#f1ece0;--dim:rgba(241,236,224,.7);--amber:#ffb547}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--night);color:var(--chalk)}
.card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:540px 1fr;background:radial-gradient(900px 500px at 75% 40%,rgba(255,181,71,.12),transparent 60%),var(--night)}
.left{padding:70px 0 0 70px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font:800 30px/1 "Big Shoulders Display",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.brand img{width:52px;height:52px}
.homemark{width:120px;height:120px;margin-bottom:10px}
h1{margin:18px 0 0;font:900 150px/.84 "Big Shoulders Display",sans-serif;letter-spacing:-.01em}
.seam{width:380px;height:30px;margin:18px 0 0}
p{margin:22px 0 0;max-width:430px;font:500 25px/1.35 Barlow,sans-serif;color:var(--dim)}
.url{position:absolute;left:70px;bottom:36px;font:600 24px/1 Barlow,sans-serif;color:var(--dim)}
.art{align-self:center;margin-right:60px;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.art svg{display:block;width:600px;height:338px}
.grid{display:grid;grid-template-columns:repeat(3,190px);gap:14px;align-self:center;margin-right:60px}
.grid svg{display:block;width:190px;height:107px;border-radius:10px}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script type="module">
import { SCENES } from '/landing/scenes.js';
import { GAMES } from '/core/games.js';
const id = new URLSearchParams(location.search).get('game') || 'home';
const g = GAMES.find(x => x.id === id);
const seam = '<svg class="seam" viewBox="0 0 360 30"><path d="M2 22 C 90 2, 270 2, 358 22" fill="none" stroke="rgba(241,236,224,.35)" stroke-width="2"/><path d="M2 22 C 90 2, 270 2, 358 22" fill="none" stroke="#d23a2e" stroke-width="7" stroke-dasharray="2 9" stroke-linecap="round" transform="translate(0,-1)"/></svg>';
/* Frozen frames of the landing page scenes, picked at a moment that reads well. */
const FRAME = { baseball: 2.55, fieldgoal: 1.75, pk: 1.75, hockey: 1.75, golf: 2.4, drag: 3.15 };
const svg = k => `<svg data-k="${k}" viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice">${SCENES[k]()}</svg>`;
const card = document.getElementById('card');
if (g) {
  const title = g.name.split(' ').join('<br>');
  const size = Math.max(...g.name.split(' ').map(w => w.length)) > 6 ? 118 : 150;
  card.innerHTML = `<div class="left"><div class="brand"><img src="/assets/logo-mark.svg" alt="">Sweet Spot</div><h1 style="font-size:${size}px">${title}</h1>${seam}<p>${g.blurb}</p></div><div class="art">${svg(g.id)}</div><div class="url">sweetspot.sawman.app${g.path}</div>`;
} else {
  card.innerHTML = `<div class="left"><div class="brand"><img src="/assets/logo-mark.svg" alt="" style="width:76px;height:76px"></div><h1 style="font-size:140px">Sweet<br>Spot</h1>${seam}<p>Six timing games. Hit the small window at exactly the right moment.</p></div><div class="grid">${GAMES.map(x => svg(x.id)).join('')}</div><div class="url">sweetspot.sawman.app</div>`;
}
document.querySelectorAll('svg[data-k]').forEach(el => { el.pauseAnimations(); el.setCurrentTime(FRAME[el.dataset.k] || 1.5); });
document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>
